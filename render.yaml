# Render Blueprint (render.yaml) — https://render.com/docs/blueprint-spec
# Adjust `plan`, `region`, and resource names for your account before deploying;
# these values are reasonable free-tier-friendly defaults, not requirements.
#
# Secrets marked `sync: false` must be set once in the Render dashboard after
# the first blueprint deploy — Render deliberately never stores secret values
# in a committed file.

databases:
  - name: abraj-al-yasir-tasks-db
    plan: free
    databaseName: abraj_al_yasir_tasks
    user: abraj

services:
  - type: redis
    name: abraj-al-yasir-tasks-redis
    plan: free
    ipAllowList: []

  - type: web
    name: abraj-al-yasir-tasks-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: abraj-al-yasir-tasks-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: abraj-al-yasir-tasks-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: abraj-al-yasir-tasks-redis
          type: redis
          property: port
      - key: JWT_ACCESS_PRIVATE_KEY_BASE64
        sync: false
      - key: JWT_ACCESS_PUBLIC_KEY_BASE64
        sync: false
      - key: CORS_ORIGIN # comma-separated frontend origins
        sync: false
      - key: SYSTEM_OWNER_EMAIL
        sync: false
      - key: SYSTEM_OWNER_PASSWORD
        sync: false
